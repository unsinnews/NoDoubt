plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}
android {
    namespace 'com.nodoubt.app'
    compileSdk 35
    defaultConfig {
        applicationId 'com.nodoubt.app'
        minSdk 23
        targetSdk 35
        versionCode 30
        versionName '0.3.0'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        // Release APKs must be signed to install. Use a private key from the environment when provided,
        // otherwise the repository key so release and debug builds can update each other.
        release {
            def keystore = System.getenv('NODOUBT_KEYSTORE')
            storeFile keystore ? file(keystore) : file('debug.keystore')
            storePassword System.getenv('NODOUBT_KEYSTORE_PASSWORD') ?: 'android'
            keyAlias System.getenv('NODOUBT_KEY_ALIAS') ?: 'androiddebugkey'
            keyPassword System.getenv('NODOUBT_KEY_PASSWORD') ?: 'android'
        }
    }
    buildTypes {
        release { signingConfig signingConfigs.release }
    }
    buildFeatures { compose true }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    kotlinOptions { jvmTarget = '17' }
    sourceSets.main.java.setSrcDirs(['src/main/kotlin'])
    packaging.resources.excludes += ['/META-INF/{AL2.0,LGPL2.1}', 'META-INF/LICENSE*', 'META-INF/NOTICE*']
}
dependencies {
    implementation project(':core:model')
    implementation project(':core:config')
    implementation project(':core:ai')
    implementation project(':core:designsystem')
    implementation project(':feature:channels')
    implementation project(':feature:solver')
    implementation project(':platform')
    implementation platform('androidx.compose:compose-bom:2025.01.01')
    implementation 'androidx.activity:activity-compose:1.10.0'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-core'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.8.7'
    implementation 'androidx.core:core-ktx:1.15.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation platform('androidx.compose:compose-bom:2025.01.01')
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'com.squareup.okhttp3:mockwebserver:4.12.0'
    androidTestImplementation 'androidx.compose.ui:ui-test-junit4'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'
}
