plugins {
    id 'com.android.application' version '8.13.1' apply false
    id 'com.android.library' version '8.13.1' apply false
    id 'org.jetbrains.kotlin.android' version '2.1.20' apply false
    id 'org.jetbrains.kotlin.jvm' version '2.1.20' apply false
    id 'org.jetbrains.kotlin.plugin.compose' version '2.1.20' apply false
}
tasks.register('clean', Delete) { delete rootProject.layout.buildDirectory }
tasks.register('checkSourceSize') {
    group = 'verification'
    description = 'Reject production Kotlin files exceeding 400 lines.'
    doLast {
        def oversized = fileTree(rootDir) {
            include '**/src/main/**/*.kt'
            exclude '**/build/**'
        }.files.findAll { it.readLines('UTF-8').size() > 400 }
        if (!oversized.empty) throw new GradleException('Split files exceeding 400 lines: ' + oversized)
    }
}